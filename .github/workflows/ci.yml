name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appealcrafter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run lint
        run: ruff check app tests

      - name: Run migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: appealcrafter_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_FROM_ADDRESS: test@example.com
          EMAIL_PHYSICAL_ADDRESS: "123 Test St"
          EMAIL_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: appealcrafter_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          SECURITY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_FROM_ADDRESS: test@example.com
          EMAIL_PHYSICAL_ADDRESS: "123 Test St"
          EMAIL_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies
        run: pip-audit -r requirements.txt --fail-on high